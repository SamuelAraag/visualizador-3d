<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1705/1705340.png" type="image/x-icon">
    <link href="https://fonts.cdnfonts.com/css/azonix" rel="stylesheet">
    <title>Visualizador 3D</title>
    <style>
        .apresentacao {
            position: absolute;
            left: 50%;
            bottom: calc(32px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
            padding: 0 22px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            font-family: 'azonix', sans-serif;
            font-size: 14px;
            letter-spacing: 0.08em;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
        }

        .apresentacao:hover {
            border-color: white;
            transform: translateX(-50%) translateY(-2px);
        }

        .apresentacao:focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
        }

        .apresentacao[aria-pressed="true"] {
            background: white;
            color: black;
            border-color: white;
        }

        .apresentacao svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .apresentacao[aria-pressed="true"] svg {
            transform: rotate(90deg);
        }

        @media (prefers-reduced-motion: reduce) {
            .apresentacao,
            .apresentacao svg {
                transition: none;
            }
        }
    </style>
</head>
<body style="background-color: black; margin: 0; font-family: 'azonix';">
    <h1 style="width: 100%; color: white; text-align: center; position: absolute; top: 26%; font-size: 50px;">
        SAMUEL ARAAG
    </h1>
    <div>
        <model-viewer
            id="carro"
            style="width: 100%; height: 100vh;"
            src="./assets/source/corvette_stingray.glb"
            camera-controls
            auto-rotate-delay="0">
        </model-viewer>
    </div>

    <button id="apresentacao" class="apresentacao" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-3-6.7"></path>
            <polyline points="21 3 21 9 15 9"></polyline>
        </svg>
        <span id="apresentacaoTexto">Apresentar</span>
    </button>

    <script>
        const carro = document.getElementById('carro');
        const botao = document.getElementById('apresentacao');
        const texto = document.getElementById('apresentacaoTexto');
        const reduzirMovimento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        carro.setAttribute('rotation-per-second', reduzirMovimento ? '-2deg' : '-5deg');

        function apresentar(ligado) {
            carro.toggleAttribute('auto-rotate', ligado);
            carro.setAttribute('interaction-prompt', ligado ? 'none' : 'auto');
            botao.setAttribute('aria-pressed', String(ligado));
            texto.textContent = ligado ? 'Parar' : 'Apresentar';
        }

        botao.addEventListener('click', () => apresentar(!carro.hasAttribute('auto-rotate')));

        const ESPERA_PARA_APRESENTAR = 3000;
        let inicioAutomatico = null;

        carro.addEventListener('camera-change', (evento) => {
            if (evento.detail.source !== 'user-interaction') return;
            clearTimeout(inicioAutomatico);
            if (carro.hasAttribute('auto-rotate')) apresentar(false);
        });

        botao.addEventListener('click', () => clearTimeout(inicioAutomatico));

        carro.addEventListener('load', () => {
            if (reduzirMovimento) return;
            inicioAutomatico = setTimeout(() => apresentar(true), ESPERA_PARA_APRESENTAR);
        }, { once: true });
    </script>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</body>
</html>
