<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1705/1705340.png" type="image/x-icon">
    <link href="https://fonts.cdnfonts.com/css/azonix" rel="stylesheet">
    <title>Visualizador 3D</title>
    <style>
        .apresentacao {
            white-space: nowrap;
            position: absolute;
            left: 50%;
            bottom: calc(32px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
            padding: 0 22px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            font-family: 'azonix', sans-serif;
            font-size: 14px;
            letter-spacing: 0.08em;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
        }

        .apresentacao:hover {
            border-color: white;
            transform: translateX(-50%) translateY(-2px);
        }

        .apresentacao:focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
        }

        .apresentacao[aria-pressed="true"] {
            background: white;
            color: black;
            border-color: white;
        }

        .apresentacao svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .apresentacao[aria-pressed="true"] svg {
            transform: rotate(90deg);
        }

        [hidden] {
            display: none !important;
        }

        html,
        body {
            overflow-x: hidden;
        }

        .palco {
            overflow: hidden;
        }

        model-viewer {
            --deslocamento: 0;
            transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease-out, filter 0.6s ease-out;
        }

        model-viewer.saindo {
            opacity: 0;
            filter: blur(6px);
            transform: translateX(var(--deslocamento)) scale(0.92);
            transition: transform 0.42s cubic-bezier(0.55, 0, 1, 0.45), opacity 0.42s ease-in, filter 0.42s ease-in;
        }

        model-viewer.posicionando {
            opacity: 0;
            filter: blur(6px);
            transform: translateX(var(--deslocamento)) scale(0.92);
            transition: none;
        }

        .nome-carro {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .nome-carro.trocando {
            opacity: 0;
            transform: translateY(6px);
        }

        .seta {
            position: absolute;
            top: 50%;
            z-index: 2;
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            cursor: pointer;
            transform: translateY(-50%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: border-color 0.3s ease, transform 0.3s ease;
        }

        .seta:hover {
            border-color: white;
        }

        .seta:active {
            transform: translateY(-50%) scale(0.94);
        }

        .seta:focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
        }

        .seta svg {
            width: 20px;
            height: 20px;
        }

        .seta--anterior {
            left: max(16px, env(safe-area-inset-left, 0px));
        }

        .seta--proximo {
            right: max(16px, env(safe-area-inset-right, 0px));
        }

        .nome-carro {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(96px + env(safe-area-inset-bottom, 0px));
            color: white;
            font-size: 13px;
            letter-spacing: 0.12em;
            text-align: center;
            opacity: 0.85;
        }

        .carregando {
            position: absolute;
            top: 50%;
            left: 50%;
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .carregando span {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .apresentacao,
            .apresentacao svg,
            model-viewer,
            .seta,
            .nome-carro {
                transition: none;
            }

            model-viewer.saindo,
            model-viewer.posicionando {
                filter: none;
                transform: none;
            }

            .carregando span {
                animation: none;
            }
        }
        body.modo-vento {
            background: radial-gradient(ellipse at 50% 42%, #4a505a 0%, #2c3038 48%, #15171b 100%) !important;
        }

        body {
            transition: background-color 0.6s ease;
        }

        h1 {
            transition: opacity 0.5s ease;
        }

        body.modo-vento h1 {
            opacity: 0;
        }

        .palco {
            position: relative;
        }

        #fluxo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.modo-vento #fluxo {
            opacity: 1;
        }

        .apresentacao--vento {
            white-space: nowrap;
            bottom: calc(92px + env(safe-area-inset-bottom, 0px));
        }

        .nome-carro {
            bottom: calc(150px + env(safe-area-inset-bottom, 0px));
        }

        .aviso-vento {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            margin: 0;
            color: rgba(255, 255, 255, 0.6);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 11px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.modo-vento .aviso-vento {
            opacity: 1;
        }
    </style>
</head>
<body style="background-color: black; margin: 0; font-family: 'azonix';">
    <h1 style="width: 100%; color: white; text-align: center; position: absolute; top: 26%; font-size: 50px;">
        SAMUEL ARAAG
    </h1>
    <div class="palco">
        <model-viewer
            id="carro"
            style="width: 100%; height: 100vh;"
            src="./assets/source/corvette_stingray.glb"
            camera-controls
            auto-rotate-delay="0"
            max-camera-orbit="auto auto 300%"
            alt="Corvette Stingray">
        </model-viewer>
        <canvas id="fluxo" aria-hidden="true"></canvas>
    </div>

    <div id="carregando" class="carregando" hidden><span></span>Carregando carro</div>

    <button id="anterior" class="seta seta--anterior" type="button" aria-label="Carro anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 6 9 12 15 18"></polyline>
        </svg>
    </button>
    <button id="proximo" class="seta seta--proximo" type="button" aria-label="Próximo carro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 6 15 12 9 18"></polyline>
        </svg>
    </button>

    <button id="vento" class="apresentacao apresentacao--vento" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 8h11a3 3 0 1 0-3-3"></path>
            <path d="M3 12h16a3 3 0 1 1-3 3"></path>
            <path d="M3 16h8a3 3 0 1 1-3 3"></path>
        </svg>
        <span id="ventoTexto">Túnel de vento</span>
    </button>

    <p id="avisoVento" class="aviso-vento">Efeito visual, não é uma simulação aerodinâmica</p>

    <p id="nomeCarro" class="nome-carro" aria-live="polite">CORVETTE STINGRAY · 1/6</p>

    <button id="apresentacao" class="apresentacao" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-3-6.7"></path>
            <polyline points="21 3 21 9 15 9"></polyline>
        </svg>
        <span id="apresentacaoTexto">Apresentar</span>
    </button>

    <script>
        const carro = document.getElementById('carro');
        const botao = document.getElementById('apresentacao');
        const texto = document.getElementById('apresentacaoTexto');
        const reduzirMovimento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        carro.setAttribute('rotation-per-second', reduzirMovimento ? '-2deg' : '-5deg');

        function apresentar(ligado) {
            carro.toggleAttribute('auto-rotate', ligado);
            carro.setAttribute('interaction-prompt', ligado ? 'none' : 'auto');
            botao.setAttribute('aria-pressed', String(ligado));
            texto.textContent = ligado ? 'Parar' : 'Apresentar';
        }

        botao.addEventListener('click', () => apresentar(!carro.hasAttribute('auto-rotate')));

        const carros = [
            { nome: 'Corvette Stingray', arquivo: './assets/source/corvette_stingray.glb' },
            { nome: 'Car Concept', arquivo: './assets/source/car_concept.glb' },
            { nome: 'Fusca 71', arquivo: './assets/source/fusca_71_azul.glb' },
            { nome: 'Fiat 147', arquivo: './assets/source/fiat_147.glb' },
            { nome: 'Fiat Uno 2001', arquivo: './assets/source/fiat_uno_2001.glb' },
            { nome: 'Escort XR3 1986', arquivo: './assets/source/escort_xr3_1986.glb' }
        ];
        const nomeCarro = document.getElementById('nomeCarro');
        const carregando = document.getElementById('carregando');
        const DURACAO_TROCA = reduzirMovimento ? 0 : 420;
        let atual = 0;

        let trocando = false;

        function trocar(direcao) {
            if (trocando) return;
            trocando = true;
            const apresentando = carro.hasAttribute('auto-rotate');
            atual = (atual + direcao + carros.length) % carros.length;
            const destino = carros[atual];

            carro.style.setProperty('--deslocamento', `${-direcao * 60}vw`);
            if (ventoLigado) limparFluxo();
            carro.classList.add('saindo');
            nomeCarro.classList.add('trocando');

            setTimeout(() => {
                carregando.hidden = false;
                carro.addEventListener('load', () => {
                    carregando.hidden = true;
                    carro.classList.remove('saindo');
                    carro.style.setProperty('--deslocamento', `${direcao * 60}vw`);
                    carro.classList.add('posicionando');
                    if (ventoLigado) {
                        posicionarDeLado().then(desenharFluxo);
                    } else if (!reduzirMovimento) {
                        carro.cameraOrbit = `${direcao * 50}deg 75deg 105%`;
                        carro.jumpCameraToGoal();
                        carro.cameraOrbit = '0deg 75deg 105%';
                    }
                    carro.getBoundingClientRect();
                    carro.classList.remove('posicionando');
                    nomeCarro.textContent = `${destino.nome.toUpperCase()} · ${atual + 1}/${carros.length}`;
                    nomeCarro.classList.remove('trocando');
                    if (!ventoLigado) apresentar(apresentando);
                    setTimeout(() => { trocando = false; }, DURACAO_TROCA);
                }, { once: true });
                carro.src = destino.preCarregado || destino.arquivo;
                carro.alt = destino.nome;
            }, DURACAO_TROCA);
        }

        document.getElementById('anterior').addEventListener('click', () => trocar(-1));
        document.getElementById('proximo').addEventListener('click', () => trocar(1));
        document.addEventListener('keydown', (evento) => {
            if (evento.key === 'ArrowLeft') trocar(-1);
            if (evento.key === 'ArrowRight') trocar(1);
        });

        const ESPERA_PARA_APRESENTAR = 3000;
        let inicioAutomatico = null;

        carro.addEventListener('camera-change', (evento) => {
            if (evento.detail.source !== 'user-interaction') return;
            clearTimeout(inicioAutomatico);
            if (carro.hasAttribute('auto-rotate')) apresentar(false);
        });

        botao.addEventListener('click', () => clearTimeout(inicioAutomatico));

        const botaoVento = document.getElementById('vento');
        const ventoTexto = document.getElementById('ventoTexto');
        const tela = document.getElementById('fluxo');
        const pincel = tela.getContext('2d');
        const AMOSTRAS = 240;
        let ventoLigado = false;
        let linhas = [];
        let camadaBase = null;
        let quadro = 0;
        let revelado = 0;
        let inicioRevelar = 0;

        function esperarQuadros(total) {
            return new Promise((resolver) => {
                const passo = (restante) => restante <= 0 ? resolver() : requestAnimationFrame(() => passo(restante - 1));
                passo(total);
            });
        }

        async function posicionarDeLado() {
            carro.removeAttribute('auto-rotate');
            carro.resetTurntableRotation(0);
            carro.cameraOrbit = `90deg 88deg ${innerWidth < innerHeight ? 175 : 105}%`;
            carro.jumpCameraToGoal();
            await esperarQuadros(6);
        }

        async function medirContorno() {
            const imagem = await createImageBitmap(await carro.toBlob({ mimeType: 'image/png' }));
            const largura = AMOSTRAS;
            const altura = Math.round(AMOSTRAS * imagem.height / imagem.width);
            const apoio = document.createElement('canvas');
            apoio.width = largura;
            apoio.height = altura;
            const contexto = apoio.getContext('2d', { willReadFrequently: true });
            contexto.drawImage(imagem, 0, 0, largura, altura);
            const pontos = contexto.getImageData(0, 0, largura, altura).data;
            const topo = new Array(largura).fill(null);
            const base = new Array(largura).fill(null);
            for (let x = 0; x < largura; x++) {
                for (let y = 0; y < altura; y++) {
                    if (pontos[(y * largura + x) * 4 + 3] > 60) {
                        if (topo[x] === null) topo[x] = y;
                        base[x] = y;
                    }
                }
            }
            return { topo, base, altura };
        }

        function suavizar(valores, raio) {
            return valores.map((_, i) => {
                let soma = 0;
                let peso = 0;
                for (let d = -raio; d <= raio; d++) {
                    const v = valores[i + d];
                    if (v === undefined) continue;
                    const p = 1 - Math.abs(d) / (raio + 1);
                    soma += v * p;
                    peso += p;
                }
                return soma / peso;
            });
        }

        function corDoAr(i, proporcao, inicio, fim) {
            const comprimento = fim - inicio;
            const frente = Math.exp(-(((i - inicio) / (comprimento * 0.2)) ** 2));
            const antes = i < inicio ? 1 : frente;
            const esteira = i > fim ? Math.min(1, (i - fim) / (comprimento * 0.35)) : 0;
            const proximidade = (1 - proporcao) ** 2;
            const matiz = 188 - 118 * antes * proximidade + 34 * esteira;
            return `hsl(${matiz}, 95%, ${62 - 8 * esteira}%)`;
        }

        function montarLinhas(contorno) {
            const { topo, base, altura } = contorno;
            const larguraTela = tela.width;
            const alturaTela = tela.height;
            const escalaX = larguraTela / AMOSTRAS;
            const escalaY = alturaTela / altura;
            const colunas = topo.map((v, i) => v === null ? -1 : i).filter((i) => i >= 0);
            if (!colunas.length) return [];
            const inicio = colunas[0];
            const fim = colunas[colunas.length - 1];
            const chao = Math.max(...base.filter((v) => v !== null));
            const alturaCarro = chao - Math.min(...topo.filter((v) => v !== null));
            const ceu = Math.max(altura * 0.1, chao - alturaCarro * 3.4);
            const comprimento = fim - inicio;
            const crua = topo.map((v) => v === null ? 0 : chao - v);
            const alturaNariz = crua[inicio + Math.round(comprimento * 0.06)];
            const alturaCauda = crua[fim - Math.round(comprimento * 0.04)];
            const subida = comprimento * 0.45;
            const descida = comprimento * 0.9;
            const suave = (t) => t * t * (3 - 2 * t);
            for (let i = 0; i < AMOSTRAS; i++) {
                if (i < inicio) crua[i] = alturaNariz * suave(Math.max(0, 1 - (inicio - i) / subida));
                if (i > fim) crua[i] = alturaCauda * suave(Math.max(0, 1 - (i - fim) / descida));
            }
            const lisa = suavizar(suavizar(crua, 20), 14).map((v, i) => Math.max(v, i >= inicio && i <= fim ? crua[i] * 0.97 : 0) + alturaCarro * 0.04);
            const resultado = [];
            const totalAcima = 30;

            for (let k = 0; k < totalAcima; k++) {
                const proporcao = ((k + 0.4) / totalAcima) ** 1.7;
                const fase = Math.random() * 6.28;
                const pontos = [];
                for (let i = 0; i < AMOSTRAS; i++) {
                    let y = chao - (lisa[i] + proporcao * (chao - ceu - lisa[i]));
                    if (i > fim) y += Math.sin(i * 0.28 + fase) * (i - fim) * 0.05 * (1 - proporcao);
                    pontos.push({ x: i * escalaX, y: y * escalaY, cor: corDoAr(i, proporcao, inicio, fim) });
                }
                resultado.push({ pontos, alfa: 0.5, fase: Math.random() });
            }

            for (let k = 0; k < 7; k++) {
                const fracao = (k + 1) / 8;
                const pontos = [];
                for (let i = inicio; i <= fim; i++) {
                    if (topo[i] === null) continue;
                    const y = topo[i] + (base[i] - topo[i]) * fracao;
                    pontos.push({ x: i * escalaX, y: y * escalaY, cor: corDoAr(i, 0.5, inicio, fim) });
                }
                resultado.push({ pontos: suavizarPontos(pontos), alfa: 0.28, fase: Math.random() });
            }

            for (let k = 0; k < 4; k++) {
                const y = chao - alturaCarro * (0.015 + k * 0.03);
                const pontos = [];
                for (let i = 0; i < AMOSTRAS; i++) pontos.push({ x: i * escalaX, y: y * escalaY, cor: corDoAr(i, 0.05, inicio, fim) });
                resultado.push({ pontos, alfa: 0.4, fase: Math.random() });
            }

            return resultado;
        }

        function suavizarPontos(pontos) {
            const ys = suavizar(pontos.map((p) => p.y), 5);
            return pontos.map((p, i) => ({ ...p, y: ys[i] }));
        }

        function traco(contexto, pontos, de, ate) {
            for (let i = Math.max(de, 1); i < Math.min(ate, pontos.length); i++) {
                contexto.strokeStyle = pontos[i].cor;
                contexto.beginPath();
                contexto.moveTo(pontos[i - 1].x, pontos[i - 1].y);
                contexto.lineTo(pontos[i].x, pontos[i].y);
                contexto.stroke();
            }
        }

        function montarCamadaBase() {
            camadaBase = document.createElement('canvas');
            camadaBase.width = tela.width;
            camadaBase.height = tela.height;
            const contexto = camadaBase.getContext('2d');
            contexto.globalCompositeOperation = 'lighter';
            contexto.lineWidth = 1 * devicePixelRatio;
            contexto.lineCap = 'round';
            linhas.forEach((linha) => {
                contexto.globalAlpha = linha.alfa;
                traco(contexto, linha.pontos, 1, linha.pontos.length);
            });
        }

        function animar(agora) {
            pincel.clearRect(0, 0, tela.width, tela.height);
            if (!inicioRevelar) inicioRevelar = agora;
            revelado = reduzirMovimento ? 1 : Math.min(1, (agora - inicioRevelar) / 1400);
            const larguraVisivel = tela.width * (1 - (1 - revelado) ** 3);
            pincel.save();
            pincel.beginPath();
            pincel.rect(0, 0, larguraVisivel, tela.height);
            pincel.clip();
            pincel.drawImage(camadaBase, 0, 0);
            if (!reduzirMovimento) {
                pincel.globalCompositeOperation = 'lighter';
                pincel.lineWidth = 1.8 * devicePixelRatio;
                pincel.lineCap = 'round';
                linhas.forEach((linha) => {
                    for (let n = 0; n < 2; n++) {
                        const posicao = ((agora / 2600 + linha.fase + n / 2) % 1) * linha.pontos.length;
                        pincel.globalAlpha = Math.min(1, linha.alfa * 1.9);
                        traco(pincel, linha.pontos, Math.floor(posicao) - 16, Math.floor(posicao));
                    }
                });
            }
            pincel.restore();
            quadro = requestAnimationFrame(animar);
        }

        function limparFluxo() {
            cancelAnimationFrame(quadro);
            pincel.clearRect(0, 0, tela.width, tela.height);
        }

        async function desenharFluxo() {
            limparFluxo();
            const area = tela.getBoundingClientRect();
            tela.width = Math.round(area.width * devicePixelRatio);
            tela.height = Math.round(area.height * devicePixelRatio);
            linhas = montarLinhas(await medirContorno());
            montarCamadaBase();
            inicioRevelar = 0;
            quadro = requestAnimationFrame(animar);
        }

        async function alternarVento() {
            ventoLigado = !ventoLigado;
            botaoVento.setAttribute('aria-pressed', String(ventoLigado));
            ventoTexto.textContent = ventoLigado ? 'Sair do túnel' : 'Túnel de vento';
            document.body.classList.toggle('modo-vento', ventoLigado);
            clearTimeout(inicioAutomatico);
            if (ventoLigado) {
                apresentar(false);
                carro.removeAttribute('camera-controls');
                await posicionarDeLado();
                await desenharFluxo();
            } else {
                limparFluxo();
                carro.setAttribute('camera-controls', '');
                carro.cameraOrbit = '0deg 75deg 105%';
                apresentar(!reduzirMovimento);
            }
        }

        botaoVento.addEventListener('click', alternarVento);
        botao.addEventListener('click', () => { if (ventoLigado) alternarVento(); });
        window.addEventListener('resize', () => { if (ventoLigado) desenharFluxo(); });

        function quandoOcioso(acao) {
            if ('requestIdleCallback' in window) requestIdleCallback(acao);
            else setTimeout(acao, 200);
        }

        function preCarregarCarros() {
            const fila = carros.slice(1);

            const proximoDaFila = () => {
                const item = fila.shift();
                if (!item) return;
                fetch(item.arquivo, { priority: 'low' })
                    .then((resposta) => {
                        if (!resposta.ok) throw new Error(resposta.statusText);
                        return resposta.blob();
                    })
                    .then((arquivo) => { item.preCarregado = URL.createObjectURL(arquivo); })
                    .catch(() => {})
                    .finally(() => quandoOcioso(proximoDaFila));
            };

            quandoOcioso(proximoDaFila);
        }

        carro.addEventListener('load', () => {
            preCarregarCarros();
            if (reduzirMovimento) return;
            inicioAutomatico = setTimeout(() => apresentar(true), ESPERA_PARA_APRESENTAR);
        }, { once: true });
    </script>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</body>
