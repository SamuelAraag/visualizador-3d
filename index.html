<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1705/1705340.png" type="image/x-icon">
    <link href="https://fonts.cdnfonts.com/css/azonix" rel="stylesheet">
    <title>Visualizador 3D</title>
    <style>
        .apresentacao {
            position: absolute;
            left: 50%;
            bottom: calc(32px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
            padding: 0 22px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            font-family: 'azonix', sans-serif;
            font-size: 14px;
            letter-spacing: 0.08em;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
        }

        .apresentacao:hover {
            border-color: white;
            transform: translateX(-50%) translateY(-2px);
        }

        .apresentacao:focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
        }

        .apresentacao[aria-pressed="true"] {
            background: white;
            color: black;
            border-color: white;
        }

        .apresentacao svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .apresentacao[aria-pressed="true"] svg {
            transform: rotate(90deg);
        }

        [hidden] {
            display: none !important;
        }

        html,
        body {
            overflow-x: hidden;
        }

        .palco {
            overflow: hidden;
        }

        model-viewer {
            --deslocamento: 0;
            transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease-out, filter 0.6s ease-out;
        }

        model-viewer.saindo {
            opacity: 0;
            filter: blur(6px);
            transform: translateX(var(--deslocamento)) scale(0.92);
            transition: transform 0.42s cubic-bezier(0.55, 0, 1, 0.45), opacity 0.42s ease-in, filter 0.42s ease-in;
        }

        model-viewer.posicionando {
            opacity: 0;
            filter: blur(6px);
            transform: translateX(var(--deslocamento)) scale(0.92);
            transition: none;
        }

        .nome-carro {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .nome-carro.trocando {
            opacity: 0;
            transform: translateY(6px);
        }

        .seta {
            position: absolute;
            top: 50%;
            z-index: 2;
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            cursor: pointer;
            transform: translateY(-50%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: border-color 0.3s ease, transform 0.3s ease;
        }

        .seta:hover {
            border-color: white;
        }

        .seta:active {
            transform: translateY(-50%) scale(0.94);
        }

        .seta:focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
        }

        .seta svg {
            width: 20px;
            height: 20px;
        }

        .seta--anterior {
            left: max(16px, env(safe-area-inset-left, 0px));
        }

        .seta--proximo {
            right: max(16px, env(safe-area-inset-right, 0px));
        }

        .nome-carro {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(96px + env(safe-area-inset-bottom, 0px));
            color: white;
            font-size: 13px;
            letter-spacing: 0.12em;
            text-align: center;
            opacity: 0.85;
        }

        .carregando {
            position: absolute;
            top: 50%;
            left: 50%;
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .carregando span {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .apresentacao,
            .apresentacao svg,
            model-viewer,
            .seta,
            .nome-carro {
                transition: none;
            }

            model-viewer.saindo,
            model-viewer.posicionando {
                filter: none;
                transform: none;
            }

            .carregando span {
                animation: none;
            }
        }

        body {
            background: #08090b radial-gradient(ellipse 110% 75% at 50% 0%, #4a505a 0%, #2c3038 42%, #08090b 100%) fixed;
        }

        .palco {
            position: relative;
        }

        .escuro {
            position: fixed;
            inset: 0;
            background: #08090b;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.4s ease 0.6s;
        }

        .pista {
            position: absolute;
            left: 50%;
            top: calc(50% + 96px);
            width: min(420px, 70vw);
            height: 1px;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.06);
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .pista i {
            display: block;
            width: calc(var(--progresso, 0) * 100%);
            height: 100%;
            margin: 0 auto;
            background: linear-gradient(90deg, transparent, #e8f1ff, transparent);
            transition: width 0.2s linear;
        }

        body:not(.chegando) .pista {
            opacity: 0;
        }

        body.chegando .escuro {
            opacity: 1;
            transition: none;
        }

        body.chegando h1 {
            transform: translateY(calc(24vh - 50%));
        }

        body.chegada h1 {
            transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1);
        }

        body.chegando model-viewer {
            opacity: 0;
        }

        body.chegada model-viewer {
            transition: opacity 0.8s ease 0.6s;
        }

        body.chegando .seta,
        body.chegando .nome-carro,
        body.chegando .apresentacao {
            opacity: 0;
            visibility: hidden;
        }

        body.chegada .nome-carro {
            transition: opacity 0.6s ease 1.8s, visibility 0s 1.8s;
        }

        body.chegada .seta,
        body.chegada .apresentacao {
            transition: opacity 0.6s ease 1.95s, visibility 0s 1.95s;
        }

        @media (prefers-reduced-motion: reduce) {
            .escuro,
            body.chegada model-viewer,
            body.chegada .nome-carro,
            body.chegada .seta,
            body.chegada .apresentacao {
                transition: opacity 0.3s ease, visibility 0s;
            }

            body.chegando h1 {
                transform: none;
            }
        }
    </style>
</head>
<body class="chegando" style="margin: 0; font-family: 'azonix';">
    <div class="escuro" aria-hidden="true"></div>
    <h1 style="width: 100%; color: white; text-align: center; position: absolute; top: 26%; font-size: 50px;">
        SAMUEL ARAAG
    </h1>
    <div class="palco">
        <model-viewer
            id="carro"
            style="width: 100%; height: 100vh;"
            src="./assets/source/corvette_stingray.glb"
            camera-controls
            auto-rotate-delay="0"
            exposure="0"
            alt="Corvette Stingray">
        </model-viewer>
        <div id="pista" class="pista" role="progressbar" aria-label="Carregando carro" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
    </div>

    <div id="carregando" class="carregando" hidden><span></span>Carregando carro</div>

    <button id="anterior" class="seta seta--anterior" type="button" aria-label="Carro anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 6 9 12 15 18"></polyline>
        </svg>
    </button>
    <button id="proximo" class="seta seta--proximo" type="button" aria-label="Próximo carro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 6 15 12 9 18"></polyline>
        </svg>
    </button>

    <p id="nomeCarro" class="nome-carro" aria-live="polite">CORVETTE STINGRAY · 1/11</p>

    <button id="apresentacao" class="apresentacao" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-3-6.7"></path>
            <polyline points="21 3 21 9 15 9"></polyline>
        </svg>
        <span id="apresentacaoTexto">Apresentar</span>
    </button>

    <script>
        const carro = document.getElementById('carro');
        const botao = document.getElementById('apresentacao');
        const texto = document.getElementById('apresentacaoTexto');
        const reduzirMovimento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        carro.setAttribute('rotation-per-second', reduzirMovimento ? '-2deg' : '-5deg');

        function apresentar(ligado) {
            carro.toggleAttribute('auto-rotate', ligado);
            carro.setAttribute('interaction-prompt', ligado ? 'none' : 'auto');
            botao.setAttribute('aria-pressed', String(ligado));
            texto.textContent = ligado ? 'Parar' : 'Apresentar';
        }

        botao.addEventListener('click', () => apresentar(!carro.hasAttribute('auto-rotate')));

        const carros = [
            { nome: 'Corvette Stingray', arquivo: './assets/source/corvette_stingray.glb' },
            { nome: 'Car Concept', arquivo: './assets/source/car_concept.glb' },
            { nome: 'Fiat 147', arquivo: './assets/source/fiat_147.glb', virado: true },
            { nome: 'Escort XR3 1986', arquivo: './assets/source/escort_xr3_1986.glb' },
            { nome: 'Fusca', arquivo: './assets/source/fusca_beetle.glb', virado: true },
            { nome: 'Camaro SS 1967', arquivo: './assets/source/camaro_ss_1967.glb' },
            { nome: 'Hennessey Blackbird', arquivo: './assets/source/hennessey_blackbird.glb' },
            { nome: 'Hennessey Venom GT', arquivo: './assets/source/hennessey_venom_gt.glb' },
            { nome: 'Hennessey Exorcist Camaro ZL1', arquivo: './assets/source/hennessey_exorcist_zl1.glb' },
            { nome: 'Camaro SS 1967 Hidden Jewel', arquivo: './assets/source/camaro_ss_hidden_jewel.glb' },
            { nome: 'Impala 1967', arquivo: './assets/source/impala_1967.glb' }
        ];
        const nomeCarro = document.getElementById('nomeCarro');
        const carregando = document.getElementById('carregando');
        const DURACAO_TROCA = reduzirMovimento ? 0 : 420;
        const ESPERA_CARREGANDO = 400;
        const CHAVE_ULTIMO_CARRO = 'vz_ultimo_carro';
        let atual = 0;

        function lerUltimoCarro() {
            try {
                return localStorage.getItem(CHAVE_ULTIMO_CARRO);
            } catch {
                return null;
            }
        }

        function salvarUltimoCarro(carroAtual) {
            try {
                localStorage.setItem(CHAVE_ULTIMO_CARRO, carroAtual.arquivo);
            } catch {}
        }

        const salvo = carros.findIndex((item) => item.arquivo === lerUltimoCarro());
        if (salvo > 0) {
            atual = salvo;
            const inicial = carros[atual];
            carro.setAttribute('src', inicial.arquivo);
            carro.setAttribute('alt', inicial.nome);
            if (inicial.virado) carro.setAttribute('orientation', '0deg 0deg 180deg');
            nomeCarro.textContent = `${inicial.nome.toUpperCase()} · ${atual + 1}/${carros.length}`;
        }

        let trocando = false;

        function trocar(direcao) {
            if (trocando) return;
            trocando = true;
            const apresentando = carro.hasAttribute('auto-rotate');
            atual = (atual + direcao + carros.length) % carros.length;
            const destino = carros[atual];

            carro.style.setProperty('--deslocamento', `${-direcao * 60}vw`);
            carro.classList.add('saindo');
            nomeCarro.classList.add('trocando');

            setTimeout(() => {
                const mostrarCarregando = setTimeout(() => { carregando.hidden = false; }, ESPERA_CARREGANDO);
                carro.addEventListener('load', () => {
                    clearTimeout(mostrarCarregando);
                    carregando.hidden = true;
                    carro.classList.remove('saindo');
                    carro.style.setProperty('--deslocamento', `${direcao * 60}vw`);
                    carro.classList.add('posicionando');
                    if (!reduzirMovimento) {
                        carro.cameraOrbit = `${direcao * 50}deg 75deg 105%`;
                        carro.jumpCameraToGoal();
                        carro.cameraOrbit = '0deg 75deg 105%';
                    }
                    carro.getBoundingClientRect();
                    carro.classList.remove('posicionando');
                    nomeCarro.textContent = `${destino.nome.toUpperCase()} · ${atual + 1}/${carros.length}`;
                    nomeCarro.classList.remove('trocando');
                    salvarUltimoCarro(destino);
                    apresentar(apresentando);
                    setTimeout(() => { trocando = false; }, DURACAO_TROCA);
                }, { once: true });
                carro.orientation = destino.virado ? '0deg 0deg 180deg' : '0deg 0deg 0deg';
                carro.src = destino.preCarregado || destino.arquivo;
                carro.alt = destino.nome;
            }, DURACAO_TROCA);
        }

        document.getElementById('anterior').addEventListener('click', () => trocar(-1));
        document.getElementById('proximo').addEventListener('click', () => trocar(1));
        document.addEventListener('keydown', (evento) => {
            if (document.body.classList.contains('chegando')) return;
            if (evento.key === 'ArrowLeft') trocar(-1);
            if (evento.key === 'ArrowRight') trocar(1);
        });

        const ESPERA_PARA_APRESENTAR = 3000;
        let inicioAutomatico = null;

        carro.addEventListener('camera-change', (evento) => {
            if (evento.detail.source !== 'user-interaction') return;
            clearTimeout(inicioAutomatico);
            if (carro.hasAttribute('auto-rotate')) apresentar(false);
        });

        botao.addEventListener('click', () => clearTimeout(inicioAutomatico));

        function quandoOcioso(acao) {
            if ('requestIdleCallback' in window) requestIdleCallback(acao);
            else setTimeout(acao, 200);
        }

        function preCarregarCarros() {
            const fila = carros.filter((_, indice) => indice !== atual);

            const proximoDaFila = () => {
                const item = fila.shift();
                if (!item) return;
                fetch(item.arquivo, { priority: 'low' })
                    .then((resposta) => {
                        if (!resposta.ok) throw new Error(resposta.statusText);
                        return resposta.blob();
                    })
                    .then((arquivo) => { item.preCarregado = URL.createObjectURL(arquivo); })
                    .catch(() => {})
                    .finally(() => quandoOcioso(proximoDaFila));
            };

            quandoOcioso(proximoDaFila);
        }

        const pista = document.getElementById('pista');
        const ORBITA_INICIAL = '0deg 75deg 105%';
        const INTRODUCAO = reduzirMovimento ? 0 : 2500;
        const inicioIntroducao = performance.now();
        let progressoReal = 0;
        let chegou = false;

        if (!reduzirMovimento) {
            carro.setAttribute('max-camera-orbit', 'auto auto 320%');
            carro.setAttribute('camera-orbit', '-35deg 82deg 320%');
        }

        function acompanharDownload(evento) {
            progressoReal = evento.detail.totalProgress;
        }

        function desenharPista(agora) {
            if (chegou) return;
            const tempo = INTRODUCAO ? Math.min(1, (agora - inicioIntroducao) / INTRODUCAO) : 1;
            const progresso = Math.min(progressoReal, tempo);
            pista.style.setProperty('--progresso', progresso);
            pista.setAttribute('aria-valuenow', String(Math.round(progresso * 100)));
            requestAnimationFrame(desenharPista);
        }

        requestAnimationFrame(desenharPista);

        function acenderCarro() {
            const inicio = performance.now();
            const duracao = reduzirMovimento ? 300 : 1700;
            const passo = (agora) => {
                const t = Math.min(1, (agora - inicio) / duracao);
                carro.exposure = 1 - (1 - t) ** 3;
                if (t < 1) requestAnimationFrame(passo);
            };
            requestAnimationFrame(passo);
        }

        function chegar() {
            chegou = true;
            carro.removeEventListener('progress', acompanharDownload);
            pista.style.setProperty('--progresso', 1);
            document.body.classList.replace('chegando', 'chegada');
            setTimeout(() => {
                acenderCarro();
                if (!reduzirMovimento) {
                    carro.interpolationDecay = 260;
                    carro.cameraOrbit = ORBITA_INICIAL;
                }
            }, reduzirMovimento ? 0 : 600);
            setTimeout(() => {
                document.body.classList.remove('chegada');
                carro.removeAttribute('interpolation-decay');
                carro.removeAttribute('max-camera-orbit');
            }, 3000);
        }

        carro.addEventListener('progress', acompanharDownload);
        function chegarDepoisDaIntroducao() {
            progressoReal = 1;
            const resta = INTRODUCAO - (performance.now() - inicioIntroducao);
            setTimeout(chegar, Math.max(0, resta) + (INTRODUCAO ? 250 : 0));
        }

        carro.addEventListener('error', () => {
            carro.exposure = 1;
            chegarDepoisDaIntroducao();
        }, { once: true });

        carro.addEventListener('load', () => {
            chegarDepoisDaIntroducao();
            preCarregarCarros();
            if (reduzirMovimento) return;
            inicioAutomatico = setTimeout(() => apresentar(true), ESPERA_PARA_APRESENTAR);
        }, { once: true });
    </script>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</body>
</html>
